[project]
name = "scooter-rental-service"
version = "0.2.0"
description = "HTTP-сервис аренды электросамокатов для Задания 2 (FastAPI / Spring Boot)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[tool.poetry]
name = "scooter-rental-service"
version = "0.2.0"
description = "HTTP-сервис аренды электросамокатов для Задания 2 (FastAPI / Spring Boot)"
authors = ["Argon1x <xox12357@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
