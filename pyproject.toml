[project]
name = "scooter-rental-service"
version = "0.3.0"
description = "Сервис аренды электросамокатов для Задания 3"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[tool.poetry]
name = "scooter-rental-service"
version = "0.3.0"
description = "Сервис аренды электросамокатов для Задания 3"
authors = ["Argon1x <xox12357@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.0.0"
